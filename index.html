<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<title>Portofolio</title>
<style>
@property --glow{syntax:'<color>';inherits:true;initial-value:#2a1e6e}
:root{--bg:#09090c;--ui:rgba(36,36,46,.58);--line:rgba(255,255,255,.1);--tx:#f5f5f7;--mut:#9a9aa8;--sb:224px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{transition:--glow 1.1s ease}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 75% 65% at 50% 42%,var(--glow),transparent 75%);opacity:.7}
#app{position:fixed;inset:0;display:flex}
#side{width:var(--sb);flex:none;display:flex;flex-direction:column;gap:14px;padding:18px 12px 24px;overflow-y:auto;background:rgba(10,10,14,.55);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-right:1px solid var(--line);transition:margin .5s var(--ease);scrollbar-width:none}
body.noside #side,body.imm #side{margin-left:calc(var(--sb)*-1)}
.th{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.th i{width:16px;padding-top:3px;text-align:right;font:500 11px/1 inherit;font-style:normal;color:var(--mut)}
.tc{flex:1;aspect-ratio:var(--r);border-radius:5px;background:#1c1c24;box-shadow:0 0 0 1px var(--line);overflow:hidden;transition:box-shadow .25s,transform .25s}
.tc canvas{width:100%;height:100%;display:block}
.th:hover .tc{transform:scale(1.02)}
.th.on .tc{box-shadow:0 0 0 2.5px #0a84ff}
.th.on i{color:var(--tx)}
#main{flex:1;min-width:0;position:relative}
#top{position:absolute;inset:0 0 auto;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;z-index:2;transition:opacity .5s}
#tt{font-weight:600;letter-spacing:.01em;opacity:.92}
#dl{color:var(--mut);text-decoration:none;font-size:13px;display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;transition:.2s}
#dl:hover{color:var(--tx);background:rgba(255,255,255,.1)}
#dl svg,.bt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.z{cursor:grab}
#zm{position:relative;border-radius:10px;box-shadow:0 40px 90px -25px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.09);will-change:transform}
body.imm #zm{border-radius:6px}
.slide{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#fff;opacity:0;transition:opacity .55s ease,transform .7s var(--ease)}
.slide.on{opacity:1;transform:none}
.slide.pn{transform:translateX(6%) scale(.97)}.slide.pp{transform:translateX(-6%) scale(.97)}
.slide.xn{opacity:0;transform:translateX(-6%) scale(.97)}.slide.xp{opacity:0;transform:translateX(6%) scale(.97)}
.slide canvas{width:100%;height:100%;display:block;object-fit:contain}
.lk a{position:absolute;display:block;border-radius:4px;transition:background .2s}
.lk a:hover{background:rgba(255,255,255,.16)}
#bar{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px 8px;border-radius:999px;background:var(--ui);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.4);z-index:3;transition:opacity .5s,transform .5s var(--ease);white-space:nowrap}
.bt{all:unset;box-sizing:border-box;min-width:36px;height:36px;display:grid;place-items:center;border-radius:999px;cursor:pointer;color:var(--tx);transition:background .2s,opacity .2s}
.bt:hover{background:rgba(255,255,255,.13)}.bt:active{background:rgba(255,255,255,.2)}
.bt:disabled{opacity:.3;pointer-events:none}.bt:focus-visible{outline:2px solid #0a84ff}
.lbl{padding:0 10px;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--tx)}
#pg{min-width:64px;text-align:center;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.sp{width:1px;height:18px;background:var(--line);margin:0 6px}
#prog{position:absolute;left:28px;right:28px;bottom:14px;display:flex;gap:6px;z-index:3;transition:opacity .5s}
#prog button{all:unset;flex:1;height:14px;cursor:pointer;position:relative}
#prog button::after{content:"";position:absolute;left:0;right:0;top:5px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);transition:background .35s,transform .25s}
#prog button.d::after{background:rgba(255,255,255,.5)}
#prog button.on::after{background:#fff}
#prog button:hover::after{transform:scaleY(1.7)}
body.idle #top,body.idle #bar,body.idle #prog{opacity:0;pointer-events:none}
body.idle{cursor:none}
#ld{position:fixed;inset:0;z-index:9;display:grid;place-content:center;justify-items:center;gap:18px;background:var(--bg);transition:opacity .8s ease,visibility .8s;text-align:center;padding:24px}
#ld.hide{opacity:0;visibility:hidden}
#ld h1{font-size:22px;font-weight:600;letter-spacing:.01em}
#ld .b{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
#ld .b i{display:block;height:100%;width:8%;background:#fff;border-radius:3px;transition:width .3s}
#ld p{color:var(--mut);max-width:360px}
@media(max-width:820px){:root{--sb:172px}#side{position:fixed;z-index:6;inset:0 auto 0 0;background:rgba(14,14,20,.9)}#top{padding:0 14px}#prog{left:14px;right:14px}#bar{bottom:30px}}
@media(max-width:560px){.zg{display:none}.bt{min-width:40px;height:40px}#dl span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>
<body class="idle-off">
<div id="app">
  <aside id="side" aria-label="Miniatur halaman"></aside>
  <main id="main">
    <div id="top"><div id="tt"></div><a id="dl" download title="Unduh PDF"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>Unduh PDF</span></a></div>
    <div id="stage"><div id="zm"></div></div>
    <div id="prog" aria-label="Posisi halaman"></div>
    <div id="bar">
      <button class="bt" id="bs" title="Miniatur (T)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <span class="sp"></span>
      <button class="bt" id="bp" title="Sebelumnya (←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="pg">– / –</span>
      <button class="bt" id="bn" title="Berikutnya (→)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="sp zg"></span>
      <button class="bt zg" id="zo" title="Perkecil (−)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="bt lbl zg" id="zl" title="Reset zoom (0)">100%</button>
      <button class="bt zg" id="zi" title="Perbesar (+)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="sp"></span>
      <button class="bt" id="bf" title="Layar penuh (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </main>
</div>
<div id="ld"><h1 id="lt"></h1><div class="b"><i></i></div><p>Memuat portofolio…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ====== PENGATURAN ====== */
const PDF_FILE='portofolio.pdf';          // ganti dengan nama file PDF Anda
const TITLE='Portofolio — Afiq Azri';
/* ======================== */
const $=s=>document.querySelector(s),B=document.body,stage=$('#stage'),zm=$('#zm'),side=$('#side');
const dpr=Math.min(devicePixelRatio||1,3);
let pdf,N=0,cur=0,ratio=16/9,zoom=1,tx=0,ty=0,tok=0;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
document.title=TITLE;$('#tt').textContent=TITLE;$('#lt').textContent=TITLE;$('#dl').href=PDF_FILE;

/* layout */
function fit(){
  const m=innerWidth<700,im=B.classList.contains('imm');
  const [t,r,b,l]=im?[10,10,10,10]:m?[52,10,96,10]:[56,36,112,36];
  stage.style.padding=`${t}px ${r}px ${b}px ${l}px`;
  const aw=stage.clientWidth-l-r,ah=stage.clientHeight-t-b;
  const w=Math.max(50,Math.min(aw,ah*ratio));
  zm.style.width=w+'px';zm.style.height=w/ratio+'px';
  clamp();tf();
}
/* render */
async function bake(n,w){
  const p=await pdf.getPage(n),v0=p.getViewport({scale:1});
  let s=w*dpr/v0.width;if(v0.width*s>4096)s=4096/v0.width;
  const v=p.getViewport({scale:s}),c=document.createElement('canvas');
  c.width=v.width|0;c.height=v.height|0;
  await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
  return {c,p};
}
async function links(p,box){
  const v=p.getViewport({scale:1});
  for(const a of await p.getAnnotations({intent:'display'})){
    if(a.subtype!=='Link'||(!a.url&&!a.dest))continue;
    const [x1,y1,x2,y2]=pdfjsLib.Util.normalizeRect(v.convertToViewportRectangle(a.rect));
    const l=document.createElement('a');
    Object.assign(l.style,{left:x1/v.width*100+'%',top:y1/v.height*100+'%',width:(x2-x1)/v.width*100+'%',height:(y2-y1)/v.height*100+'%'});
    if(a.url){l.href=a.url;l.target='_blank';l.rel='noopener'}
    else{l.href='#';l.onclick=async e=>{e.preventDefault();let d=a.dest;if(typeof d==='string')d=await pdf.getDestination(d);if(d)go((await pdf.getPageIndex(d[0]))+1)}}
    box.append(l);
  }
}
function glow(c){
  const t=document.createElement('canvas');t.width=t.height=8;const x=t.getContext('2d');x.drawImage(c,0,0,8,8);
  const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0;
  for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
  const k=d.length/4;[r,g,b]=[r,g,b].map(v=>v/k);
  const m=Math.max(r,g,b);if(m>130){const f=130/m;r*=f;g*=f;b*=f}
  B.style.setProperty('--glow',`rgb(${r|0},${g|0},${b|0})`);
}
async function go(n){
  n=Math.max(1,Math.min(N,n|0));if(!n||n===cur)return;
  const dir=n>cur?1:-1,my=++tok;cur=n;ui();
  zoom=1;tx=ty=0;tf(true);
  const {c,p}=await bake(n,zm.clientWidth);
  if(my!==tok)return;
  const el=document.createElement('div');el.className='slide '+(dir>0?'pn':'pp');el.dataset.n=n;
  const lk=document.createElement('div');lk.className='lk';el.append(c,lk);
  document.querySelectorAll('.slide.on').forEach(o=>{o.classList.remove('on');o.classList.add(dir>0?'xn':'xp');setTimeout(()=>o.remove(),800)});
  zm.append(el);el.offsetWidth;el.classList.remove('pn','pp');el.classList.add('on');
  glow(c);links(p,lk);
}
let rt;function rerender(){
  clearTimeout(rt);rt=setTimeout(async()=>{
    const el=document.querySelector('.slide.on');if(!el)return;const n=+el.dataset.n;
    const {c}=await bake(n,zm.clientWidth*Math.max(1,zoom));
    if(el.isConnected&&n===cur)el.querySelector('canvas').replaceWith(c);
  },240);
}
/* ui */
function ui(){
  $('#pg').textContent=cur+' / '+N;$('#bp').disabled=cur<2;$('#bn').disabled=cur>=N;
  document.querySelectorAll('.th').forEach(t=>{const on=+t.dataset.n===cur;t.classList.toggle('on',on);if(on)t.scrollIntoView({block:'nearest',behavior:'smooth'})});
  document.querySelectorAll('#prog button').forEach((b,i)=>{b.classList.toggle('on',i+1===cur);b.classList.toggle('d',i+1<cur)});
  history.replaceState(null,'','#'+cur);
}
function build(){
  const pr=$('#prog');side.style.setProperty('--r',ratio);
  for(let i=1;i<=N;i++){
    const b=document.createElement('button');b.setAttribute('aria-label','Halaman '+i);b.onclick=()=>go(i);pr.append(b);
    const d=document.createElement('div');d.className='th';d.dataset.n=i;d.innerHTML=`<i>${i}</i><div class="tc"><canvas></canvas></div>`;
    d.onclick=()=>{go(i);if(innerWidth<821)B.classList.add('noside')};side.append(d);
  }
  const io=new IntersectionObserver(es=>es.forEach(async x=>{
    if(!x.isIntersecting)return;io.unobserve(x.target);
    const c=x.target.querySelector('canvas'),p=await pdf.getPage(+x.target.dataset.n),v0=p.getViewport({scale:1}),v=p.getViewport({scale:200*dpr/v0.width});
    c.width=v.width|0;c.height=v.height|0;p.render({canvasContext:c.getContext('2d'),viewport:v});
  }),{root:side,rootMargin:'300px'});
  side.querySelectorAll('.th').forEach(t=>io.observe(t));
}
/* zoom & pan */
function tf(smooth){
  zm.style.transition=smooth?'transform .4s var(--ease)':'none';
  zm.style.transform=`translate(${tx}px,${ty}px) scale(${zoom})`;
  $('#zl').textContent=Math.round(zoom*100)+'%';stage.classList.toggle('z',zoom>1);
}
function clamp(){
  if(zoom<=1){zoom=1;tx=ty=0;return}
  const mx=zm.clientWidth*(zoom-1)/2,my=zm.clientHeight*(zoom-1)/2;
  tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty));
}
function zoomAt(z,pt,smooth){
  z=Math.max(1,Math.min(4,z));
  const r=zm.getBoundingClientRect(),cx=r.left+r.width/2-tx,cy=r.top+r.height/2-ty;
  const px=pt?pt.x-cx:0,py=pt?pt.y-cy:0;
  tx=px-(px-tx)*z/zoom;ty=py-(py-ty)*z/zoom;zoom=z;clamp();tf(smooth);rerender();
}
const P=new Map();let moved=false,sx=0,sy=0,sd=0,pinched=false;
const dist=()=>{const [a,b]=[...P.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
const mid=()=>{const [a,b]=[...P.values()];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}};
stage.addEventListener('pointerdown',e=>{
  P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size===1){moved=false;pinched=false;sx=e.clientX;sy=e.clientY}
  if(P.size===2){sd=dist();pinched=moved=true}
});
addEventListener('pointermove',e=>{
  const o=P.get(e.pointerId);if(!o)return;
  const dx=e.clientX-o.x,dy=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;
  if(P.size===2){const d=dist();if(sd)zoomAt(zoom*d/sd,mid());sd=d;return}
  if(Math.hypot(e.clientX-sx,e.clientY-sy)>6)moved=true;
  if(zoom>1&&moved){tx+=dx;ty+=dy;clamp();tf()}
});
const up=e=>{
  if(!P.has(e.pointerId))return;P.delete(e.pointerId);sd=0;
  if(P.size)return;
  if(zoom>1)rerender();
  else if(!pinched&&moved&&e.pointerType!=='mouse'){
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)go(cur+(dx<0?1:-1));
  }
};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
stage.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation()}},true);
stage.addEventListener('dblclick',e=>{zoom>1?zoomAt(1,null,true):zoomAt(2.2,{x:e.clientX,y:e.clientY},true)});
let wl=false;
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){zoomAt(zoom*Math.exp(-e.deltaY*.01),{x:e.clientX,y:e.clientY})}
  else if(zoom>1){tx-=e.deltaX;ty-=e.deltaY;clamp();tf();rerender()}
  else if(!wl&&Math.abs(e.deltaX)>30&&Math.abs(e.deltaX)>Math.abs(e.deltaY)){wl=true;setTimeout(()=>wl=false,700);go(cur+(e.deltaX>0?1:-1))}
},{passive:false});
/* fullscreen, sidebar, idle */
function fs(){
  const d=document,e=d.documentElement,on=d.fullscreenElement||d.webkitFullscreenElement;
  if(on)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else if(e.requestFullscreen||e.webkitRequestFullscreen)(e.requestFullscreen||e.webkitRequestFullscreen).call(e);
  else{B.classList.toggle('imm');fit();rerender()}
}
document.addEventListener('fullscreenchange',()=>{B.classList.toggle('imm',!!document.fullscreenElement);fit();rerender()});
let it;function wake(){B.classList.remove('idle');clearTimeout(it);it=setTimeout(()=>{if(B.classList.contains('imm'))B.classList.add('idle')},2600)}
['pointermove','pointerdown','keydown'].forEach(t=>addEventListener(t,wake,{passive:true}));
/* events */
$('#bp').onclick=()=>go(cur-1);$('#bn').onclick=()=>go(cur+1);$('#bf').onclick=fs;
$('#bs').onclick=()=>B.classList.toggle('noside');
$('#zi').onclick=()=>zoomAt(zoom*1.4,null,true);$('#zo').onclick=()=>zoomAt(zoom/1.4,null,true);$('#zl').onclick=()=>zoomAt(1,null,true);
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)&&!(zoom>1&&k.startsWith('Arrow'))){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)&&!(zoom>1&&k.startsWith('Arrow'))){e.preventDefault();go(cur-1)}
  else if(zoom>1&&k.startsWith('Arrow')){const s=60;if(k==='ArrowLeft')tx+=s;if(k==='ArrowRight')tx-=s;if(k==='ArrowUp')ty+=s;if(k==='ArrowDown')ty-=s;clamp();tf(true);rerender()}
  else if(k==='Home')go(1);else if(k==='End')go(N);
  else if(k==='f'||k==='F')fs();
  else if(k==='t'||k==='T')B.classList.toggle('noside');
  else if(k==='+'||k==='=')zoomAt(zoom*1.4,null,true);
  else if(k==='-'||k==='_')zoomAt(zoom/1.4,null,true);
  else if(k==='0')zoomAt(1,null,true);
  else if(k==='Escape'&&B.classList.contains('imm')&&!document.fullscreenElement){B.classList.remove('imm');fit();rerender()}
});
addEventListener('hashchange',()=>{const n=+location.hash.slice(1);if(n&&n!==cur)go(n)});
let rq;new ResizeObserver(()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{if(!N)return;fit();rerender()})}).observe(stage);
/* start */
(async()=>{
  if(innerWidth<821)B.classList.add('noside');
  try{
    const t=pdfjsLib.getDocument({url:PDF_FILE});
    t.onProgress=({loaded,total})=>{if(total)$('#ld .b i').style.width=Math.max(8,loaded/total*100)+'%'};
    pdf=await t.promise;N=pdf.numPages;
    const v=(await pdf.getPage(1)).getViewport({scale:1});ratio=v.width/v.height;
    build();fit();
    await go(+location.hash.slice(1)||1);
    $('#ld').classList.add('hide');wake();
  }catch(err){
    console.error(err);
    $('#ld .b').remove();
    $('#ld p').textContent=location.protocol==='file:'
      ?'File PDF tidak bisa dibuka langsung dari folder. Jalankan lewat server lokal (mis. "python -m http.server") atau publikasikan ke GitHub Pages.'
      :'PDF tidak ditemukan. Pastikan file "'+PDF_FILE+'" berada satu folder dengan index.html.';
  }
})();
</script>
</body>
</html>
